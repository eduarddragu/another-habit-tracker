<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="(Another) Habit Tracker">
  <rect x="1" y="1" width="1278" height="358" rx="18" fill="#1a1714" stroke="#342c26" stroke-width="2"/>
  <text x="72" y="92" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="4" fill="#d9632f">A HABIT TRACKER FOR ONE</text>
  <text x="68" y="150" font-family="'Cormorant Garamond', 'Iowan Old Style', Georgia, 'Times New Roman', serif" font-size="52" font-style="italic" font-weight="500" fill="#d9632f">(Another)</text>
