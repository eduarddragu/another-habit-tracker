  <text x="72" y="278" font-family="'DM Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#b3a597">It picks tonight's topic. Then it nags.</text>
  <text x="72" y="308" font-family="'DM Sans', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#b3a597">The streak dies at midnight.</text>
